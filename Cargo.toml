[workspace]
resolver = "2"
members = [
    "crates/gecko-core",
    "crates/gecko-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Oscar Torreno", "Oswaldo Trelles", "GECKO Contributors"]
repository = "https://github.com/otorreno/gecko"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
