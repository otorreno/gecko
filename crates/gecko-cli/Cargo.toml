[package]
name = "gecko-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI for GECKO pairwise genome comparison"

[[bin]]
name = "gecko"
path = "src/main.rs"

[[bin]]
name = "metagecko"
path = "src/metagecko.rs"

[features]
default = ["wgpu"]
wgpu = ["dep:gecko-wgpu"]
cuda = ["dep:gecko-cuda", "gecko-cuda/cuda-native"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
gecko-core = { path = "../gecko-core" }
gecko-cuda = { path = "../gecko-cuda", optional = true }
gecko-wgpu = { path = "../gecko-wgpu", optional = true }
rayon = "1"
serde_json = "1"

[dev-dependencies]
flate2 = "1"
tempfile = "3"
